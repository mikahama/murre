name: Installation smoke test

on: [push, pull_request]

jobs:
  installation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install into a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/murre-venv"
          "$RUNNER_TEMP/murre-venv/bin/python" -m pip install --upgrade pip
          # CPU wheels avoid installing CUDA libraries for an import-only check.
          "$RUNNER_TEMP/murre-venv/bin/python" -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          "$RUNNER_TEMP/murre-venv/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/murre-venv/bin/python" -m pip check
      - name: Check installed package outside the checkout (no model downloads)
        working-directory: ${{ runner.temp }}
        run: '"$RUNNER_TEMP/murre-venv/bin/python" "$GITHUB_WORKSPACE/tests/test_installation.py" -v'
